# Build the Shinylive site (shinylive/export_shinylive.R) and publish it to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # shinylive detects the apps' packages from the installed copies
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::shinylive
            any::shiny
            any::SimInf
            any::igraph
            any::RColorBrewer
          dependencies: '"hard"'

      # Cache the downloaded Shinylive/webR assets between runs
      - uses: actions/cache@v4
        with:
          path: ~/.cache/shinylive
          key: shinylive-${{ runner.os }}-${{ hashFiles('.github/workflows/deploy.yml') }}

      - name: Export apps
        run: Rscript shinylive/export_shinylive.R

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
